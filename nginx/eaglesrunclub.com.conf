# Nginx virtual host for Eagles Run Club (https://eaglesrunclub.com)
# Assumes the boomhut Nginx container is attached to the `boomhut_ingress` Docker network.

server {
    listen 80;
    listen [::]:80;
    server_name eaglesrunclub.com www.eaglesrunclub.com;

    # Allow Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eaglesrunclub.com www.eaglesrunclub.com;

    ssl_certificate /etc/letsencrypt/live/eaglesrunclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaglesrunclub.com/privkey.pem;

    # SSE endpoints (/api/stream and /api/scraper/events) require unbuffered streaming
    location ~ ^/api/(stream|scraper/events)$ {
        proxy_pass http://eagles-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Web UI (/ and /devices) and REST API (/api/*)
    location / {
        proxy_pass http://eagles-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
