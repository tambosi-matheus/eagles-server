<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sign In · Eagles Run Club</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 26px 22px;
        display: grid;
        gap: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .brand {
        display: grid;
        gap: 4px;
      }
      .kicker {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #38bdf8;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
      }
      .subtitle {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.45;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
        display: grid;
        gap: 6px;
      }
      input {
        width: 100%;
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 15px;
      }
      input:focus {
        outline: none;
        border-color: #38bdf8;
      }
      button {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .error {
        display: none;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        background: rgba(239, 68, 68, 0.16);
        border: 1px solid rgba(239, 68, 68, 0.45);
        color: #fca5a5;
      }
      .error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <span class="kicker">Eagles Run Club</span>
        <h1>Sign In</h1>
        <p class="subtitle">Enter the club access code to continue.</p>
      </div>

      <div id="error" class="error" role="alert"></div>

      <form id="login-form">
        <label>
          Access Code
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter access code"
            required
            autofocus
          />
        </label>
        <button id="submit-btn" type="submit">Sign In</button>
      </form>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const passwordEl = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error');

      function getSafeNext() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        if (next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/login')) {
          return next;
        }
        return '/';
      }

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        errorEl.classList.remove('visible');
        submitBtn.disabled = true;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordEl.value }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || 'Invalid access code.');
          }
          window.location.href = getSafeNext();
        } catch (err) {
          errorEl.textContent = err.message || 'Sign in failed. Please try again.';
          errorEl.classList.add('visible');
          passwordEl.select();
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
