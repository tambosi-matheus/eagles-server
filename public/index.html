<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Eagles Run Club · Live Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <span id="route-name">Loading route…</span>
        <span id="connection-badge" class="badge badge-connecting">Connecting</span>
      </div>
      <div class="topbar-actions">
        <nav class="topbar-nav" aria-label="Primary">
          <a href="/" class="icon-btn active" aria-current="page">Map</a>
          <a href="/devices" class="icon-btn">Devices</a>
          <a href="/auth" class="icon-btn">Auth</a>
        </nav>
        <button id="btn-fit" class="icon-btn" title="Fit entire route">Fit</button>
        <button id="btn-raw" class="icon-btn" title="Show actual GPS positions">GPS Dots: Off</button>
        <button id="btn-logout" class="icon-btn" type="button">Sign Out</button>
      </div>
    </header>

    <main id="map"></main>

    <section class="sheet" id="sheet">
      <div class="sheet-handle" id="sheet-toggle">
        <div class="handle-bar"></div>
        <div class="sheet-header">
          <strong>Runners (<span id="runner-count">0</span>)</strong>
          <span class="hint">Tap a runner to focus</span>
        </div>
      </div>
      <div class="runner-list" id="runner-list">
        <div class="empty-state">
          No runners on the course yet.<br />
          Live positions will appear here as soon as tracking starts.
        </div>
      </div>
    </section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
