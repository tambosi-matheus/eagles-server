<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Live Tracking · Eagles Run Club</title>
    <link rel="stylesheet" href="/devices.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <span>Live Tracking</span>
        <span id="status-badge" class="badge badge-connecting">Connecting…</span>
      </div>
      <div class="topbar-actions">
        <nav class="topbar-nav" aria-label="Primary">
          <a href="/" class="icon-btn">Map</a>
          <a href="/devices" class="icon-btn active" aria-current="page">Devices</a>
          <a href="/auth" class="icon-btn">Auth</a>
        </nav>
        <button id="btn-logout" class="icon-btn" type="button">Sign Out</button>
      </div>
    </header>

    <main class="container">
      <div id="auth-warning" class="warning-banner hidden" role="alert">
        <div class="warning-content">
          <strong>Google sign-in required</strong>
          <span>Location updates are paused until the Google account is signed in again.</span>
        </div>
        <a href="/auth" class="btn btn-warning">Sign in</a>
      </div>

      <div id="alert-box" class="alert hidden" role="alert"></div>

      <section class="summary-bar">
        <div class="summary-text">
          <strong id="status-summary">Paused</strong>
          <span id="status-sub" class="muted">No devices active</span>
        </div>
        <div class="summary-actions">
          <button id="btn-start-all" class="btn btn-primary" type="button" disabled>
            Track All
          </button>
          <button id="btn-stop-all" class="btn btn-danger" type="button" disabled>
            Stop All
          </button>
        </div>
      </section>

      <section id="device-list" class="device-list">
        <div class="empty-state">Loading devices…</div>
      </section>
    </main>

    <script src="/devices.js"></script>
  </body>
</html>
