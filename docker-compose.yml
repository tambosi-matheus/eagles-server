services:
  eagles-server:
    build: .
    container_name: eagles-server
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      ROUTE_FILE: ${ROUTE_FILE:-/app/data/curitiba-route.json}
    volumes:
      - ./data:/app/data:ro
    expose:
      - "3000"
    networks:
      - music-dash-server_ingress

networks:
  music-dash-server_ingress:
    external: true
